services:
  db:
    image: postgres:16
    container_name: cashi_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cashidb
    ports:
      - "5432:5432"
    volumes:
      - cashi_postgres_data:/var/lib/postgresql/data

volumes:
  cashi_postgres_data:
