services:
  - type: web
    name: cashi-api
    plan: free
    env: node
    buildCommand: corepack enable && yarn install && npx prisma generate && npx prisma migrate deploy && yarn build
    startCommand: yarn start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cashi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: cashi-db
    plan: free
    databaseName: cashi
    user: cashi_user
